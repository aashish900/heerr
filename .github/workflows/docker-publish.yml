# Build, scan, and publish the heerr-backend Docker image to Docker Hub.
#
# Triggers:
#   - pull_request to main          → build + trivy scan only (no push).
#                                     Validates the image for every PR.
#   - push to a git tag matching v* → build + trivy scan + push to Docker Hub.
#
# Pipeline:
#   1. Build single-arch (amd64) locally with `load: true` so a concrete
#      image exists in the runner's daemon — trivy needs a loadable image
#      (it can't scan a multi-arch manifest without pulling each platform).
#   2. Trivy scan: fail the workflow on HIGH or CRITICAL CVEs in OS
#      packages or python deps. This gate runs on every PR + every tag.
#   3. (Tag refs only) build multi-arch (amd64 + arm64) and push. BuildKit
#      cache means the amd64 layers from step 1 are reused.
#
# Image tags produced on a tag push (e.g. `git tag v0.1.0 && git push --tags`):
#   - aashish010/heerr-backend:0.1.0    (semver full)
#   - aashish010/heerr-backend:0.1      (semver major.minor)
#   - aashish010/heerr-backend:latest   (always points at the most recent tag)
#   - aashish010/heerr-backend:sha-abc1234  (commit SHA for traceability)
#
# Platforms: linux/amd64 + linux/arm64 (multi-arch manifest).
#
# Required GitHub repo secrets:
#   - DOCKERHUB_USERNAME  → aashish010
#   - DOCKERHUB_TOKEN     → access token from Docker Hub (Account Settings →
#                           Security → New Access Token; scope: Read & Write).
#                           Do NOT use your Docker Hub password.
#
# Cache: GitHub Actions cache (type=gha). 10 GB cap, LRU eviction. Switch to
# `type=registry,ref=aashish010/heerr-backend:buildcache` if you outgrow it.

name: Publish backend image to Docker Hub

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/docker-publish.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    name: backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation for arm64 on amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64, local load for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: heerr-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Installed straight from the GitHub release rather than via
      # aquasecurity/trivy-action: its setup-trivy installer downloads from
      # get.trivy.dev, which stopped resolving (curl exit 6) and broke every run
      # since 2026-08. The release tarball is checksum-verified against the
      # release's own checksums.txt.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.1"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy "${tarball}" checksums.txt
          trivy --version

      - name: Trivy vulnerability scan
        # Fail the workflow on any unfixed CVE at HIGH+ severity (--ignore-unfixed
        # skips upstream-unfixed CVEs).
        #
        # /opt/spotdl-venv is a vendored isolated CLI tool (spotdl 4.5.0
        # + yt-dlp). We invoke it via subprocess only — never expose its
        # bundled FastAPI/uvicorn web mode. Its CVEs (e.g. older starlette
        # via spotdl's pinned fastapi==0.103.x) are outside our threat
        # model, and yt-dlp extractor source files contain hardcoded
        # service-specific literals that trip the secrets scanner with
        # false positives. See DECISIONLOG 2026-06-09 "Trivy: skip spotdl
        # venv".
        run: |
          trivy image \
            --format table \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --skip-dirs /opt/spotdl-venv,/app/.venv \
            heerr-backend:scan

      - name: Log in to Docker Hub
        # Only log in when we're actually going to push, so secrets are not
        # surfaced to pull_request runs (which include PRs from forks).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aashish010/heerr-backend
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
